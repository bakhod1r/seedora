<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seedora access token</title>
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0d0f12; --bg-sunken:#090a0c; --surface:#15181d; --surface-2:#1c2027; --surface-3:#242931;
  --border:#262b33; --border-strong:#333a45;
  --fg:#e8eaee; --fg-muted:#9aa3b0; --fg-subtle:#6b7480;
  --accent:#3fa06a; --accent-hover:#4bb87a; --accent-fg:#fff; --accent-soft:rgba(63,160,106,.14); --accent-line:rgba(63,160,106,.4);
  --warn:#d1a038; --warn-soft:rgba(209,160,56,.13); --warn-line:rgba(209,160,56,.42);
  --danger:#d2564c; --danger-soft:rgba(210,86,76,.13); --danger-line:rgba(210,86,76,.42);
  --link:#5b9bd8;
  --shadow-2:0 4px 12px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#f6f7f9; --bg-sunken:#eceef2; --surface:#fff; --surface-2:#f2f4f7; --surface-3:#e7eaef;
  --border:#dfe3e9; --border-strong:#c3cad4; --fg:#16191e; --fg-muted:#5b6472; --fg-subtle:#8a93a0;
  --accent:#2f8a57; --accent-hover:#277a4c; --accent-soft:rgba(47,138,87,.1); --accent-line:rgba(47,138,87,.35);
  --warn:#a87a14; --warn-soft:rgba(168,122,20,.1); --warn-line:rgba(168,122,20,.35);
  --danger:#b8433a; --danger-soft:rgba(184,67,58,.1); --danger-line:rgba(184,67,58,.35);
  --link:#2f6fb0; --shadow-2:0 4px 12px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:0.8125rem/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
code, .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; }
header.top { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; }
header.top h1 { font-size:0.875rem; margin:0; font-weight:600; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; }
.tab { background:transparent; border:1px solid var(--border); color:var(--fg-muted); border-radius:999px; padding:4px 12px; cursor:pointer; font:inherit; }
.tab[aria-selected="true"] { background:var(--accent-soft); color:var(--fg); border-color:var(--accent-line); }
.tab .rec { color:var(--accent); font-size:0.6875rem; margin-left:4px; }
.spacer { flex:1; }
.theme { background:var(--surface-2); border:1px solid var(--border); color:var(--fg); border-radius:5px; padding:4px 8px; cursor:pointer; font:inherit; }
main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
.pros { font-size:0.75rem; color:var(--fg-muted); margin:0 0 16px; }
.pros b { color:var(--fg); }
.stage { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.panel h3 { margin:0; padding:8px 12px; font-size:0.6875rem; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-subtle); border-bottom:1px solid var(--border); background:var(--surface-2); }
.term { background:var(--bg-sunken); padding:12px; font-size:0.75rem; white-space:pre-wrap; word-break:break-all; min-height:180px; margin:0; }
.term .ok { color:var(--accent); } .term .dim { color:var(--fg-subtle); } .term .u { color:var(--link); text-decoration:underline; cursor:pointer; }
.browser { min-height:260px; display:flex; flex-direction:column; }
.addr { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--border); background:var(--surface-2); }
.addr input { flex:1; min-width:0; background:var(--bg-sunken); border:1px solid var(--border); color:var(--fg); border-radius:5px; padding:4px 8px; font:0.75rem ui-monospace,Menlo,monospace; }
.view { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { max-width:340px; width:100%; text-align:center; }
.card h2 { font-size:1.0625rem; margin:8px 0 4px; }
.card p { color:var(--fg-muted); margin:0 0 12px; }
.glyph { width:40px; height:40px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:1.1rem; }
.glyph.lock { background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); }
.glyph.bad { background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger-line); }
.glyph.load { background:var(--surface-3); color:var(--fg-muted); animation:spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .glyph.load { animation:none; } }
.field { display:flex; gap:6px; margin-top:8px; }
.field input { flex:1; min-width:0; background:var(--bg-sunken); border:1px solid var(--border-strong); color:var(--fg); border-radius:8px; padding:8px 10px; font:0.8125rem ui-monospace,Menlo,monospace; }
.field input:focus-visible, button:focus-visible, .tab:focus-visible { outline:2px solid var(--accent-line); outline-offset:1px; }
.btn { background:var(--accent); color:var(--accent-fg); border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font:inherit; font-weight:600; }
.btn:hover { background:var(--accent-hover); }
.btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--border-strong); }
.err { color:var(--danger); font-size:0.75rem; min-height:1.2em; margin-top:6px; }
.app { width:100%; align-self:stretch; display:flex; flex-direction:column; gap:8px; }
.app .bar { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; }
.dot { width:8px; height:8px; border-radius:999px; background:var(--accent); }
.pill { font-size:0.6875rem; border-radius:999px; padding:1px 8px; border:1px solid var(--border); color:var(--fg-muted); }
.pill.warn { color:var(--warn); border-color:var(--warn-line); background:var(--warn-soft); }
.skel { height:34px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); }
.controls { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0; }
.small { font-size:0.75rem; color:var(--fg-subtle); }
</style>
</head>
<body>
<header class="top">
  <h1>Seedora — access token</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="a" aria-selected="true">A · Link token<span class="rec">recommended</span></button>
    <button class="tab" role="tab" data-v="b">B · Paste-token screen</button>
    <button class="tab" role="tab" data-v="c">C · Token only off loopback</button>
  </div>
  <span class="spacer"></span>
  <button class="theme" id="theme">Light</button>
</header>
<main>
  <p class="pros" id="pros"></p>
  <div class="stage">
    <section class="panel"><h3>Terminal</h3><pre class="term" id="term"></pre></section>
    <section class="panel browser"><h3>Browser</h3>
      <div class="addr"><input id="url" aria-label="Address" spellcheck="false"><button class="btn ghost" id="go">Go</button></div>
      <div class="view" id="view"></div>
    </section>
  </div>
  <div class="controls">
    <button class="btn ghost" data-sim="open">Open the printed link</button>
    <button class="btn ghost" data-sim="bare">Open without the token</button>
    <button class="btn ghost" data-sim="wrong">Open with a wrong token</button>
    <button class="btn ghost" data-sim="remote">Another machine on the network</button>
  </div>
  <p class="small">Click the buttons to walk the states: loading, signed in, locked, wrong token, and a remote attacker.</p>
</main>
<script>
const TOKEN = "k3Qx9vT2mB7wL0pR8sYc";
const variants = {
  a: { pros: "<b>A · Link token.</b> Good: nothing to type — the printed link signs the tab in (HttpOnly cookie), and the token leaves the address bar at once; works bound to 0.0.0.0. Bad: a user who opens the bare URL has to go back to the terminal for the link.",
       bind: "127.0.0.1:7777", needsToken: () => true, lockedCard: "link" },
  b: { pros: "<b>B · Paste-token screen.</b> Good: a bare URL still gets a clear way in, and the token can be shared out of band. Bad: an extra step every new tab/session; a form invites weak tokens being set by hand.",
       bind: "127.0.0.1:7777", needsToken: () => true, lockedCard: "form" },
  c: { pros: "<b>C · Token only off loopback.</b> Good: zero friction in the common local case. Bad: other local users and any page exploiting a loopback service reach the API without a token — the gap the audit flagged stays open on shared machines.",
       bind: "0.0.0.0:7777", needsToken: (remote) => remote, lockedCard: "link" },
};
let v = "a";
const $ = (id) => document.getElementById(id);
function terminal() {
  const bind = variants[v].bind;
  const link = `http://${bind.replace("0.0.0.0","192.168.1.20")}/?token=${TOKEN}`;
  $("term").innerHTML =
`<span class="dim">$</span> seedora "postgres://app@localhost/app_dev"
<span class="ok">✓</span> connected — 14 tables
Seedora is running on ${bind}
` + (v === "c" ? `Open <span class="u" data-sim="open">http://127.0.0.1:7777/</span>
<span class="dim">Other machines need: ${link}</span>` :
`Open <span class="u" data-sim="open">${link}</span>
<span class="dim">The token is new each launch. Ctrl-C to stop.</span>`);
}
function show(state, url) {
  $("url").value = url;
  const view = $("view");
  if (state === "loading") { view.innerHTML = `<div class="card"><span class="glyph load" aria-hidden="true">◌</span><p>Checking access…</p></div>`; return; }
  if (state === "app") {
    view.innerHTML = `<div class="app"><div class="bar"><span class="dot"></span><b>app_dev</b><span class="pill">PostgreSQL</span><span class="spacer"></span><span class="pill">signed in for this tab</span></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
    return;
  }
  if (state === "remote-open") {
    view.innerHTML = `<div class="app"><div class="bar"><span class="dot" style="background:var(--danger)"></span><b>app_dev</b><span class="pill warn">reachable without a token</span></div><div class="skel"></div><p class="small">Variant C: this is another machine, and it got in because loopback was trusted.</p></div>`;
    return;
  }
  const bad = state === "wrong";
  const head = bad ? `<span class="glyph bad" aria-hidden="true">!</span><h2>That link has expired</h2><p>The token did not match. Seedora makes a new one every launch — use the link from the terminal you started it in.</p>`
                   : `<span class="glyph lock" aria-hidden="true">🔒</span><h2>Open Seedora from its link</h2><p>This server only answers the tab opened from the link it printed when it started.</p>`;
  if (variants[v].lockedCard === "form") {
    view.innerHTML = `<div class="card">${head}<form id="f" class="field"><input id="tok" aria-label="Access token" placeholder="Paste the token" autocomplete="off"><button class="btn">Unlock</button></form><div class="err" id="err" role="alert"></div></div>`;
    $("f").onsubmit = (e) => { e.preventDefault();
      const t = $("tok").value.trim();
      if (!t) { $("err").textContent = "Paste the token from the terminal."; return; }
      if (t !== TOKEN) { $("err").textContent = "Token does not match."; return; }
      show("loading", "http://127.0.0.1:7777/"); setTimeout(() => show("app","http://127.0.0.1:7777/"), 500); };
  } else {
    view.innerHTML = `<div class="card">${head}<button class="btn ghost" data-sim="copyhint">Where is the link?</button><p class="small" id="hint" hidden>In the terminal: “Open http://…/?token=…”. Restarted Seedora? The old link no longer works.</p></div>`;
  }
}
function sim(kind) {
  const base = `http://${variants[v].bind.replace("0.0.0.0","127.0.0.1")}/`;
  if (kind === "copyhint") { const h = $("hint"); if (h) h.hidden = false; return; }
  if (kind === "open") { show("loading", base + "?token=" + TOKEN); setTimeout(() => show("app", base), 600); return; }
  if (kind === "bare") { if (!variants[v].needsToken(false)) { show("app", base); return; } show("locked", base); return; }
  if (kind === "wrong") { if (!variants[v].needsToken(false)) { show("app", base); return; } show("wrong", base + "?token=old123"); return; }
  if (kind === "remote") { const u = "http://192.168.1.20:7777/"; if (v === "c") { show("locked", u); return; }
    if (variants[v].bind.startsWith("127.")) { $("url").value = u; $("view").innerHTML = `<div class="card"><span class="glyph bad" aria-hidden="true">×</span><h2>Can’t connect</h2><p>Bound to 127.0.0.1 — nothing is listening on the network.</p></div>`; return; }
    show("locked", u); }
}
function select(next) {
  v = next;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.v === v)));
  $("pros").innerHTML = variants[v].pros;
  terminal(); sim("bare");
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-sim]"); if (t) sim(t.dataset.sim);
  const tab = e.target.closest(".tab"); if (tab) select(tab.dataset.v);
});
$("go").onclick = () => { const u = $("url").value;
  const m = u.match(/token=([^&]+)/);
  if (!m) sim("bare"); else if (m[1] === TOKEN) sim("open"); else sim("wrong"); };
$("theme").onclick = () => { const r = document.documentElement; const light = r.dataset.theme !== "light";
  r.dataset.theme = light ? "light" : "dark"; $("theme").textContent = light ? "Dark" : "Light"; };
select("a");
</script>
</body>
</html>
