name: Feature request
description: Something Seedora should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you were trying to do when you wanted this. The problem is more
        useful than the solution — there is often a shorter way to it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Including "nothing, I gave up", which is a useful answer.
