name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The UI is embedded, so this really is the whole artefact: one file, no
      # runtime, nothing to install alongside it. CGO stays off — the SQLite
      # driver is pure Go, and turning it on would mean a C toolchain per
      # target.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME}"
          name="seedora"
          [ "$GOOS" = windows ] && name="seedora.exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${name}" ./cmd/seedora

      - name: Package
        run: |
          cd dist
          base="seedora_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp ../README.md ../LICENSE ../CHANGELOG.md .
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "${base}.zip" seedora.exe README.md LICENSE CHANGELOG.md
          else
            tar czf "${base}.tar.gz" seedora README.md LICENSE CHANGELOG.md
          fi
          # Checksums per artefact, joined into one file by the release job.
          sha256sum "${base}".* > "${base}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: seedora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: cat dist/*.sha256 > dist/checksums.txt

      # The release notes are the CHANGELOG's section for this tag. A changelog
      # that is written and then not used is a changelog that stops being
      # written.
      - name: Extract the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for ${GITHUB_REF_NAME}." > notes.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
