name: test

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result worthless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    # Seeding runs on a worker pool and the drivers are exercised against a real
    # server, so the tests need one. SQLite is a file and needs nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: seedora
          POSTGRES_USER: seedora
          POSTGRES_DB: seedora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seedora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: seedora
          MYSQL_DATABASE: seedora_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pseedora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned rather than taken from the image, so the page's tests run on a
      # known runtime — they use node's built-in test runner, which is only
      # stable from 20 on.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: go build ./...

      # The race detector is not optional here: generation runs on its own
      # goroutines while a driver holds an open COPY.
      - name: Test
        run: go test -race -count=1 ./...
        env:
          SEEDORA_TEST_POSTGRES: postgres://seedora:seedora@localhost:5432/seedora_test?sslmode=disable
          SEEDORA_TEST_MYSQL: mysql://root:seedora@127.0.0.1:3306/seedora_test

      # The diagram's router and layout are plain functions and are tested with
      # node's own runner. No install step and no package.json: the UI has no
      # build toolchain and this does not give it one.
      - name: Test the page's geometry
        run: node --test tests/ui/

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  # The page in a real Chromium. A separate job because it installs a browser
  # and a Python environment, neither of which the Go tests should wait on, and
  # neither of which is needed to build or ship Seedora.
  browser:
    name: the page in a browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test
        run: python -m pytest tests/browser/ -q
