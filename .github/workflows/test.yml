name: test

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result worthless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    # Seeding runs on a worker pool and the drivers are exercised against a real
    # server, so the tests need one. SQLite is a file and needs nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: seedora
          POSTGRES_USER: seedora
          POSTGRES_DB: seedora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seedora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: seedora
          MYSQL_DATABASE: seedora_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pseedora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # The race detector is not optional here: generation runs on its own
      # goroutines while a driver holds an open COPY.
      - name: Test
        run: go test -race -count=1 ./...
        env:
          SEEDORA_TEST_POSTGRES: postgres://seedora:seedora@localhost:5432/seedora_test?sslmode=disable
          SEEDORA_TEST_MYSQL: mysql://root:seedora@127.0.0.1:3306/seedora_test

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
